; qmllint settings; any warning fails the lint.
[General]
MaxWarnings=0

[Warnings]
; `var` inside blocks, as in Omarchy's own shell code.
BlockScopeVarDeclaration=disable
; Omarchy hands widgets their bar as a plain QtObject and declares
; Style.font and Style.spacing as QtObject too, so qmllint can't see their
; members (bar.foreground, Style.font.body, ...); Omarchy's own widgets get
; the same warnings. Everything else still fails the lint.
MissingProperty=disable
